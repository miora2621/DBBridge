<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        :root {
            --primary-blue: #2490ef; /* Bleu ERPNext */
            --light-bg: #f9fafc;    /* Fond clair ERPNext */
            --text-dark: #2e3338;   /* Texte foncé */
            --text-light: #6c7680;  /* Texte secondaire */
            --white: #ffffff;
            --border-color: #d1d8dd;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
            --error-red: #ff4d4d;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
            color: var(--primary-blue);
            font-size: 2rem;
            font-weight: 600;
        }

        form {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(36, 144, 239, 0.2);
        }

        .password-container {
            position: relative;
            margin-bottom: 20px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary-blue);
        }

        button {
            width: 100%;
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1a7bc9; /* Bleu légèrement plus foncé */
        }

        .error-message {
            color: var(--error-red);
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        form {
            animation: fadeIn 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">ERPNext</div>
        <form th:action="@{/login}" method="post">
            <h2>Connexion</h2>
            <input name="username" placeholder="Email" required />
            
            <div class="password-container">
                <input id="password" name="password" type="password" placeholder="Mot de passe" required />
                <span class="toggle-password" onclick="togglePassword()">
                    👁️
                </span>
            </div>
            
            <button type="submit">Se connecter</button>
            
            <p th:if="${error}" th:text="${error}" class="error-message"></p>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById("password");
            const icon = document.querySelector(".toggle-password");
            
            if (passwordField.type === "password") {
                passwordField.type = "text";
                icon.textContent = "🙈";
            } else {
                passwordField.type = "password";
                icon.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
