    <style>
        .loader_factory {
            width: 100px;
            aspect-ratio: 1;
            display: grid;
            border: 4px solid #0000;
            border-radius: 50%;
            border-right-color: #25b09b;
            animation: l15 1s infinite linear;
        }
        .loader_factory::before,
        .loader_factory::after {
            content: "";
            grid-area: 1/1;
            margin: 2px;
            border: inherit;
            border-radius: 50%;
            animation: l15 2s infinite;
        }
        .loader_factory::after {
            margin: 8px;
            animation-duration: 3s;
        }
        @keyframes l15{
            100%{transform: rotate(1turn)}
        }

        .terminal {
            width: 100%;
            overflow-y: auto;
            overflow-x: auto;
            height: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: .25rem;
            padding: 15px;
            white-space: pre-wrap;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .terminal::-webkit-scrollbar{
            width: 10px;
        }

        .terminal::-webkit-scrollbar-track{
            background: rgba(25, 25, 25, 0.79);
        }

        .terminal::-webkit-scrollbar-thumb{
            background: rgba(255, 255, 255, 0.56);
        }

        .terminal::-webkit-scrollbar-thumb:hover{
            background: rgba(255, 255, 255, 0.89);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1em;
            background: #c9d1d9;
            margin-left: 2px;
            animation: blink 1s steps(2, start) infinite;
            vertical-align: bottom;
        }

        @keyframes blink { 50% { opacity: 0; } }

    </style>

<script>
    "use strict";

    async function sendData() {
        const params = new URLSearchParams();
        /*Info Oracle*/
        params.append("hostOracle", document.getElementById("hostOracle").value);
        params.append("portOracle", document.getElementById("portOracle").value);
        params.append("serviceOracle", document.getElementById("serviceOracle").value);
        params.append("sidOracle", document.getElementById("sidOracle").value);
        params.append("userOracle", document.getElementById("userOracle").value);
        params.append("mdpOracle", document.getElementById("mdpOracle").value);

        /*Info Postgresql*/
        params.append("hostPostgres", document.getElementById("hostPostgres").value);
        params.append("portPostgres", document.getElementById("portPostgres").value);
        params.append("bddPostgres", document.getElementById("bddPostgres").value);
        params.append("userPostgres", document.getElementById("userPostgres").value);
        params.append("mdpPostgres", document.getElementById("mdpPostgres").value);

        /*Type de migration*/
        params.append("typeMigration", document.querySelector('input[name="typeMigration"]:checked').value);

        // Appel à la servlet
        await fetch("http://localhost:2621/api/Migration?" + params.toString())
            .then(response => {
                if (!response.ok) throw new Error("Erreur serveur " + response.status);
                return response.json();
            })
            .then(data => {
                let status = data.status;
                if (status==="success"){
                    iziToast.success({
                        title: 'Succes,',
                        message: data.message,
                        position: 'topRight'
                    });
                    let valTypeMigration = document.querySelector('input[name="typeMigration"]:checked').value;
                    if (valTypeMigration==="1"){
                        document.getElementById("typeMigration2").style.display = "none";
                    }
                    if (valTypeMigration==="2"){
                        document.getElementById("typeMigration1").style.display = "none";
                    }
                    console.log("Résultat JSON :", data);
                    /*Manova anle stat global*/
                    document.getElementById("totalStat").textContent = data.total;
                    document.getElementById("succesStat").textContent = data.totalSucces;
                    document.getElementById("echecStat").textContent = data.totalEchec;
                    console.log(data.log);
                    afficherTexte(data.log);
                    let reussite = (data.totalSucces/data.total)*100;
                    let echec = (data.totalEchec/data.total)*100;
                    // document.getElementById("tauxStat").textContent = data.tauxReussite+"%";

                    /*Manova chart*/
                    chart2(data.statistiques);
                    affChartPourcentage([reussite,echec])
                    let dashBoard = document.getElementById("dashboard");
                    dashBoard.setAttribute("isPrint","true");
                }else {
                    iziToast.error({
                        title: 'Erreur !',
                        message: data.message,
                        position: 'topRight'
                    });
                    let dashBoard = document.getElementById("dashboard");
                    dashBoard.setAttribute("isPrint","false");
                }

            })
            .catch(err => {
                console.error("Erreur AJAX :", err);
            });
    }

    function replaceZeros(arr) {
        return arr.map(x => x === 0 ? null : x);
    }

    async function start(){
        var loader = document.getElementById("loader_container");
        loader.style.display = "flex";

        await sendData();

        loader.style.display = "none";
        let dashBoard = document.getElementById("dashboard");
        let isPrint = dashBoard.getAttribute("isPrint");
        if (isPrint==="true"){
            dashBoard.style.display = "block";
        }
    }
    document.addEventListener("DOMContentLoaded", function() {

    });

    function chart2(data) {
        var options = {
            chart: {
                height: 250,
                type: 'bar',
                stacked: true,
                toolbar: {
                    show: false
                },
                zoom: {
                    enabled: true
                }
            },
            plotOptions: {
                bar: {
                    horizontal: false,
                    columnWidth: '50%',
                    borderRadius: 4
                },
            },
            series: [{
                name: 'Tables',
                data: replaceZeros(data.tables)
            }, {
                name: 'Views',
                data: replaceZeros(data.views)
            }, {
                name: 'Sequences',
                data: replaceZeros(data.sequences)
            }, {
                name: 'Fonctions',
                data: replaceZeros(data.fonctions)
            }],
            xaxis: {
                categories: ['Total', 'Succès', 'Échec'], // ✅ ici tes 3 valeurs fixes
                labels: {
                    style: {
                        colors: "#9aa0ac",
                        fontSize: '13px'
                    }
                }
            },
            yaxis: {
                labels: {
                    style: {
                        colors: "#9aa0ac"
                    }
                }
            },
            legend: {
                position: 'top',
                offsetY: 5,
                show: true,
            },
            fill: {
                opacity: 1
            },
            // colors: ['#008FFB', '#00E396', '#FEB019'], // optionnel : couleurs personnalisées
        };

        var chart = new ApexCharts(
            document.querySelector("#chart2"),
            options
        );

        chart.render();
    }

    function affChartPourcentage(data){
        var ctx = document.getElementById("myChart3").getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: data,
                    backgroundColor: [
                        '#00e396',
                        '#ff3025'
                    ],
                    label: 'Taux de reussite'
                }],
                labels: [
                    'Succes',
                    'Echec'
                ],
            },
            options: {
                responsive: true,
                legend: {
                    position: 'bottom',
                },
            }
        });
    }

    const terminal = document.getElementById('terminal');
    const downloadBtn = document.getElementById('downloadBtn');
    let displayedText = ''; // contiendra tout le texte affiché

    // 🔹 Fonction pour afficher un texte (avec effet de saisie)
    function afficherTexte(text, vitesse = 5) {
        let i = 0;
        const cursor = document.createElement('span');
        cursor.classList.add('cursor');
        terminal.appendChild(cursor);

        function step() {
            if (i < text.length) {
                const char = text[i++];
                cursor.insertAdjacentText('beforebegin', char);
                displayedText += char;
                terminal.scrollTop = terminal.scrollHeight;
                setTimeout(step, vitesse);
            } else {
                cursor.remove();
            }
        }
        step();
    }

    function getDateTimeForFilename() {
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        // Aucun caractère interdit : on remplace ":" par "-"
        return `${year}-${month}-${day}_${hours}-${minutes}-${seconds}`;
    }

    function telechargerContenu() {
        const blob = new Blob([displayedText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'details_migration_'+getDateTimeForFilename()+'.txt';
        a.click();
        URL.revokeObjectURL(url);
    }

    downloadBtn.addEventListener('click', telechargerContenu);

</script>
